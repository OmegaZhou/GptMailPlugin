# Include this snippet only in the configured HTTPS server block.
location = /mail-mcp {
    include /etc/nginx/snippets/gpt-mail-proxy.conf;
}
location ^~ /mail-mcp/ {
    include /etc/nginx/snippets/gpt-mail-proxy.conf;
}
# Resource metadata points to the separate account authentication service.
location = /.well-known/oauth-protected-resource/mail-mcp {
    include /etc/nginx/snippets/gpt-mail-proxy.conf;
}
